name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # The suite is stdlib-only on purpose: the skill's whole premise is that
      # it runs anywhere with a python3, and a test suite that needs a pip
      # install would not prove that.
      - name: run the suite
        run: python3 -m unittest discover -s tests -t . -v
